<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wedding banquet setting, Hong Kong · Anzon Wong</title>
<meta name="description" content="Seating layouts, ceiling plan, SketchUp model and renders for a private wedding banquet in Hong Kong, 2011, by Anzon Wong.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231d1c1a'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='16' fill='%23f5f2ec' text-anchor='middle'%3EAW%3C/text%3E%3C/svg%3E">
<!--
  project-showcase / gallery-workspace.html (tier B), v1 2026-10-04.
  Same B2 frame as interior-workspace.html (site bar, header, terracotta-dark sidebar, tabs, right panel),
  but the centre is an image workspace instead of a live 3D model:
  large viewer + thumbnail strip + captions + keyboard (left/right) + swipe + lightbox,
  an Overview grid, and a Process pane of pairs (before/after slider "slider" or side by side "side").
  EVERYTHING project-specific lives in the JSON block id="data" (and <title>/<meta> above). Images in img/.
  Bilingual: EN default, 中文 (書面語) by toggle, ?lang=zh, or localStorage aw-lang (same as the home site).
-->
<style>
/* ===== site bar (design-standard/site-bar.css v0.1, inlined) ===== */
:root{--awsb-h:40px}
.awsb,.awsb *,.awsb-foot,.awsb-foot *{all:unset;box-sizing:border-box}
.awsb{display:flex;align-items:center;gap:14px;height:var(--awsb-h);padding:0 clamp(16px,4vw,48px);background:#f5f2ec;color:#1d1c1a;border-bottom:1px solid #d9d3c7;font:13px/1 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;position:relative;z-index:50;min-width:0;overflow:hidden;white-space:nowrap}
.awsb a{cursor:pointer;color:inherit;text-decoration:none}
.awsb-mark{font-family:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,"Noto Serif TC","Songti TC","Microsoft JhengHei",serif;font-size:17px;letter-spacing:.01em;color:#1d1c1a;flex:none}
.awsb-sep{display:block;width:1px;height:16px;background:#d9d3c7;flex:none}
.awsb-sec{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:#4a4741;padding:3px 0;border-bottom:1px solid transparent;flex:none}
.awsb-page{font-size:13px;color:#6f6a60;overflow:hidden;text-overflow:ellipsis;min-width:0}
.awsb-grow{flex:1;min-width:0}
.awsb-home{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:#4a4741;border:1px solid #d9d3c7;border-radius:3px;padding:5px 9px;flex:none}
.awsb-lang{font:11px/1 ui-monospace,"Cascadia Mono",Consolas,monospace;color:#1d1c1a;border:1px solid #1d1c1a;border-radius:3px;padding:5px 8px;cursor:pointer;flex:none}
.awsb-lang:hover{background:#1d1c1a;color:#f5f2ec}
.awsb a:hover{color:#9c4a2f}
.awsb a.awsb-sec:hover{border-bottom-color:#9c4a2f}
.awsb a.awsb-home:hover{border-color:#1d1c1a;color:#1d1c1a}
.awsb a:focus-visible,.awsb-lang:focus-visible,.awsb-foot a:focus-visible{outline:2px solid #9c4a2f;outline-offset:3px;border-radius:2px}
.awsb-foot{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;padding:14px clamp(16px,4vw,48px) 18px;background:#f5f2ec;color:#6f6a60;border-top:1px solid #1d1c1a;font:12.5px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif}
.awsb-foot b{font:10.5px/1.5 ui-monospace,"Cascadia Mono",Consolas,monospace;letter-spacing:.1em;text-transform:uppercase;color:#6f6a60}
.awsb-foot a{cursor:pointer;color:#1d1c1a;text-decoration:underline;text-underline-offset:3px}
.awsb-foot span{display:inline}
@media (max-width:560px){.awsb-page,.awsb-page-sep{display:none}}
@media (max-width:380px){.awsb-home{display:none}}

/* ===== B2 workspace frame (design standard 4.1 / 4.2) ===== */
:root{
  --paper:#f5f2ec; --panel:#FFFFFF; --card:#fbfaf7; --ink:#1d1c1a; --muted:#6f6a60; --faint:#a39d92; --rule:#d9d3c7;
  --side:#2B1913; --side2:#3A2219; --side-ink:#F5F2EC; --side-mute:#C9AC9E; --side-accent:#D98A68;
  --accent:#9c4a2f; --accent-text:#7d3a24; --moss:var(--accent); --moss-bg:#F3E7E1; --amber-bg:#F7EFE2;
  --viewer:#EFEEE9;
  --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,"Noto Serif TC","Songti TC","Microsoft JhengHei",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html[lang="en"] .zh{display:none!important}
html[lang="zh-Hant"] .en{display:none!important}
html[lang="zh-Hant"] body{letter-spacing:.02em}
body{margin:0;background:var(--paper);color:var(--ink);font:400 14px/1.55 var(--sans);overflow-x:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.side :focus-visible{outline-color:var(--side-accent)}
img{max-width:100%;height:auto;display:block}
.cap{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.app{display:grid;grid-template-columns:260px minmax(0,1fr) 300px;grid-template-rows:56px minmax(0,1fr);min-height:calc(100vh - var(--awsb-h))}
.top{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding-inline:16px;background:var(--panel);border-bottom:1px solid var(--rule);min-width:0}
.brand{display:flex;align-items:center;gap:10px;min-width:0;width:228px}
.mark{width:30px;height:30px;border-radius:50%;background:var(--side);display:grid;place-items:center;flex:none}
.brand b{font-weight:600;font-size:14px;display:block;line-height:1.1}
.brand span{font-size:9.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.crumb{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px;min-width:0;overflow:hidden;white-space:nowrap}
.crumb .pill{border:1px solid var(--rule);border-radius:4px;padding:1px 7px;font-size:11px;color:var(--accent-text);background:var(--moss-bg)}
.top .grow{flex:1}
.btn{appearance:none;border:1px solid var(--rule);background:var(--panel);border-radius:6px;padding:7px 12px;display:inline-flex;gap:7px;align-items:center;cursor:pointer;font-size:12.5px;white-space:nowrap}
.btn:hover{border-color:#c9c8c0}
.btn.dark{background:var(--side);color:var(--side-ink);border-color:var(--side)}

.side{background:var(--side);color:var(--side-ink);padding:22px 20px;display:flex;flex-direction:column;gap:22px;overflow:auto}
.side .cap{color:var(--side-mute)}
.side h1{font-family:var(--serif);font-weight:400;font-size:26px;line-height:1.25;margin:8px 0 0;text-wrap:balance}
.side h1 small{display:block;font-size:15px;color:var(--side-mute);margin-top:6px;line-height:1.4}
.side .loc{font-size:12px;color:var(--side-mute);margin:10px 0 0}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;padding-block:16px;border-block:1px solid rgba(245,242,236,.12)}
.specs div{display:grid;gap:1px;min-width:0}
.specs span{font-size:11px;color:var(--side-mute)}
.specs b{font-family:var(--mono);font-weight:500;font-size:17px;letter-spacing:-.01em}
.specs b small{font-size:11px;color:var(--side-mute);margin-left:3px;font-weight:400}
.role{font-size:12.5px;line-height:1.55}
.role .tbc{display:inline-block;margin-left:6px;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#2B1913;background:#E8C79A;border-radius:2px;padding:1px 5px;vertical-align:1px}
.rounds{list-style:none;margin:0;padding:0;display:grid;gap:3px}
.rounds button{appearance:none;width:100%;border:0;background:transparent;display:grid;grid-template-columns:20px 1fr auto;gap:10px;align-items:center;padding:8px;border-radius:6px;text-align:left;cursor:pointer;color:var(--side-ink)}
.rounds button:hover{background:rgba(245,242,236,.07)}
.rounds .tick{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--side-mute);display:grid;place-items:center}
.rounds .tick svg{width:10px;height:10px}
.rounds .who{font-size:10px;color:var(--side-mute);font-family:var(--mono)}
.rounds .t{font-size:13px}
.rounds button.done .tick{border-color:var(--side-accent);color:var(--side-accent)}
.rounds button[aria-current="true"]{background:var(--paper);color:var(--ink)}
.rounds button[aria-current="true"] .tick{background:var(--accent);border-color:var(--accent);color:#fff}
.rounds button[aria-current="true"] .who{color:var(--muted)}
.side .foot{margin-top:auto;font-size:11px;color:var(--side-mute);line-height:1.6;border-top:1px solid rgba(245,242,236,.12);padding-top:14px}

.centre{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--panel);border-right:1px solid var(--rule)}
.tabs{display:flex;align-items:stretch;border-bottom:1px solid var(--rule);padding-inline:12px;gap:2px;overflow-x:auto}
.tab{appearance:none;border:0;background:none;padding:12px 14px;display:flex;gap:7px;align-items:center;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-size:13px}
.tab svg{width:14px;height:14px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:500}
.tabs .tag{margin-left:auto;align-self:center;color:var(--muted);white-space:nowrap;padding-left:12px}
.pane{flex:1;min-height:0;display:none}
.pane.on{display:flex;flex-direction:column}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--rule);border-radius:7px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{appearance:none;border:0;background:transparent;border-radius:5px;padding:5px 11px;cursor:pointer;font-size:12px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--side);color:#fff}

/* ===== gallery viewer (tier B centre) ===== */
.gstage{position:relative;flex:1;min-height:380px;background:var(--viewer);overflow:hidden;touch-action:pan-y;user-select:none}
.gstage .frame{position:absolute;inset:64px 64px 44px}
.gstage .frame img{-webkit-user-drag:none;position:absolute;inset:0;margin:auto;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;box-shadow:0 10px 30px rgba(29,28,26,.14);background:#fff;cursor:zoom-in;transition:opacity .25s}
.gstage .frame img.fading{opacity:0}
.vhead{position:absolute;inset:0 0 auto 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 18px 0;z-index:2;pointer-events:none}
.vhead h2{font-family:var(--serif);font-weight:400;font-size:20px;margin:0;line-height:1.25}
.vhead .cap{color:var(--muted);margin-top:3px}
.gnav{position:absolute;top:50%;transform:translateY(-50%);z-index:3;appearance:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--rule);background:var(--panel);display:grid;place-items:center;cursor:pointer}
.gnav:hover{border-color:var(--ink)}
.gnav.prev{left:14px}.gnav.next{right:14px}
.gnav svg{width:16px;height:16px}
.gcount{position:absolute;right:18px;bottom:14px;font-family:var(--mono);font-size:11px;color:var(--muted);z-index:2}
.ghint{position:absolute;left:18px;bottom:14px;font-size:11px;color:var(--muted);z-index:2}
.gzoom{position:absolute;right:14px;top:14px;z-index:3;appearance:none;width:32px;height:32px;border-radius:6px;border:1px solid var(--rule);background:var(--panel);display:grid;place-items:center;cursor:pointer}
.gzoom svg{width:15px;height:15px}
.gcap{border-top:1px solid var(--rule);padding:12px 18px;display:flex;justify-content:space-between;gap:16px;align-items:baseline;background:var(--panel)}
.gcap p{margin:0;max-width:72ch;font-size:13.5px}
.gcap .cap{color:var(--muted);white-space:nowrap}
.strip{border-top:1px solid var(--rule);padding:12px 18px 14px;display:grid;gap:10px;background:var(--panel);min-width:0}
.strip .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.strip h3{margin:0;font-size:13px;font-weight:600;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;min-width:0}
.strip h3 span{font-weight:400;color:var(--muted);font-size:12px}
.gthumbs{display:grid;grid-auto-flow:column;grid-auto-columns:96px;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.gthumbs button{appearance:none;border:0;background:none;padding:0;cursor:pointer;display:grid;gap:4px;text-align:left}
.gthumbs img{width:96px;height:64px;object-fit:cover;border:1px solid var(--rule);border-radius:3px;opacity:.82}
.gthumbs span{font-family:var(--mono);font-size:9.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gthumbs button:hover img{opacity:1;border-color:var(--ink)}
.gthumbs button[aria-current="true"] img{opacity:1;outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.gthumbs button[aria-current="true"] span{color:var(--ink)}

/* ===== document panes ===== */
.doc{overflow:auto;padding:22px clamp(16px,2.4vw,32px) 40px;display:grid;gap:30px;align-content:start}
.doc h2{font-family:var(--serif);font-weight:400;font-size:24px;margin:0}
.doc .lead{color:var(--muted);max-width:66ch;margin:6px 0 0}
.ovgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px 14px}
.ovgrid figure{margin:0;display:grid;gap:6px}
.ovgrid button{appearance:none;border:1px solid var(--rule);background:#fff;padding:0;border-radius:4px;overflow:hidden;cursor:pointer}
.ovgrid button:hover{border-color:var(--ink)}
.ovgrid img{width:100%;aspect-ratio:4/3;object-fit:cover}
.ovgrid figcaption{display:grid;gap:1px;font-size:12.5px}
.ovgrid figcaption span{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.06em}
.pairs{display:grid;gap:30px}
.pair{margin:0;display:grid;gap:8px}
.pair figcaption{display:flex;justify-content:space-between;gap:12px;font-size:13px;flex-wrap:wrap}
.pair figcaption span{color:var(--muted);font-family:var(--mono);font-size:10.5px}
.pair p{margin:0;color:var(--muted);font-size:12.5px;max-width:70ch}
.side2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.side2 div{position:relative}
.side2 img{border:1px solid var(--rule);border-radius:6px;cursor:zoom-in;width:100%}
/* before/after slider: reusable component */
.cmp{position:relative;overflow:hidden;border-radius:6px;border:1px solid var(--rule);background:#fff;max-width:100%}
.cmp img{width:100%;user-select:none;pointer-events:none}
.cmp .over{position:absolute;inset:0;clip-path:inset(0 calc(100% - var(--x,50%)) 0 0)}
.cmp .over img{height:100%;object-fit:cover}
.cmp .bar{position:absolute;top:0;bottom:0;left:var(--x,50%);width:2px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.cmp .knob{position:absolute;top:50%;left:var(--x,50%);transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25);display:grid;place-items:center;font-size:11px}
.lab{position:absolute;top:8px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;background:rgba(29,28,26,.78);color:#fff;padding:2px 7px;border-radius:3px;z-index:1}
.lab.l{left:8px}.lab.r{right:8px}
.cmp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:ew-resize}
.tl{list-style:none;margin:0;padding:0;display:grid}
.tl li{display:grid;grid-template-columns:84px 16px minmax(0,1fr);gap:0 14px;cursor:pointer}
.tl time{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-align:right;padding-top:2px}
.tl .d{position:relative}
.tl .d::before{content:"";position:absolute;left:7px;top:0;bottom:0;width:1px;background:var(--rule)}
.tl .d::after{content:"";position:absolute;left:2px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--panel);border:2px solid var(--accent)}
.tl li[aria-current="true"] .d::after{background:var(--accent)}
.tl .b{padding-bottom:18px;display:grid;gap:3px;max-width:62ch}
.tl .b h4{margin:0;font-size:14px;font-weight:600}
.tl .b p{margin:0;color:var(--muted);font-size:13px}
.tl .who{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-text)}

/* ===== right panel ===== */
.right{background:var(--panel);overflow:auto;padding:18px 18px 28px;display:grid;gap:20px;align-content:start}
.right section{display:grid;gap:10px}
.right section + section{border-top:1px solid var(--rule);padding-top:18px}
.rh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rh h3{margin:0;font-size:13px;font-weight:600;display:flex;gap:7px;align-items:center}
.rh h3 svg{width:14px;height:14px}
.rh .pill{font-size:10.5px;border:1px solid var(--rule);border-radius:4px;padding:1px 6px;color:var(--muted)}
.big{font-family:var(--serif);font-size:30px;font-weight:400;line-height:1}
.big small{font-family:var(--sans);font-size:12px;color:var(--muted);margin-left:4px}
.meta{list-style:none;margin:0;padding:0;display:grid}
.meta li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--rule);font-size:12.5px}
.meta li span:first-child{color:var(--muted)}
.meta li span:last-child{text-align:right}
.glist{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.glist button{appearance:none;width:100%;border:0;background:none;display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:baseline;padding:6px 6px;border-radius:5px;cursor:pointer;text-align:left;font-size:12.5px}
.glist button:hover{background:var(--paper)}
.glist button[aria-current="true"]{background:var(--moss-bg)}
.glist .d{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.glist .n{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.note{border-radius:7px;padding:11px 12px;font-size:12px;line-height:1.6;margin:0}
.note.moss{background:var(--moss-bg);color:var(--accent-text)}
.note.amber{background:var(--amber-bg);color:#6F4E23}
.note b{display:block;font-size:11.5px;margin-bottom:3px}
.note ul{margin:0;padding-left:14px}

dialog{border:0;border-radius:10px;padding:0;max-width:min(96vw,1500px);background:#111}
dialog::backdrop{background:rgba(29,28,26,.84)}
dialog img{max-height:84vh;width:auto;margin-inline:auto}
dialog .dc{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;color:#F5F2EC;font-size:13px}
dialog .dc button{appearance:none;border:1px solid #555;background:none;color:#fff;border-radius:6px;padding:3px 10px;cursor:pointer}
dialog.brief{background:var(--panel);max-width:560px}
dialog.brief .in{padding:22px 24px;display:grid;gap:10px;color:var(--ink);font-size:13.5px}
dialog.brief h3{margin:0;font-family:var(--serif);font-weight:400;font-size:21px}
dialog.brief ul{margin:0;padding-left:18px;display:grid;gap:5px}

@media (min-width:1181px){.app{height:calc(100vh - var(--awsb-h));min-height:620px}.app>*{min-height:0}}
@media (max-width:1180px){
  .app{grid-template-columns:230px minmax(0,1fr)}
  .right{grid-column:1/-1;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
  .right section + section{border-top:0;padding-top:0}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .top{padding:10px 16px;flex-wrap:wrap;height:auto}
  .brand{width:auto}.crumb{display:none}
  .side{padding-inline:16px}
  .gstage{min-height:62vh}
  .gstage .frame{inset:70px 12px 40px}
  .gnav{width:34px;height:34px;top:auto;bottom:6px;transform:none}
  .gnav.prev{left:auto;right:58px}.gnav.next{right:16px}
  .gcount{right:auto;left:18px;bottom:16px}.ghint{display:none}
  .gcap{flex-direction:column;gap:4px;padding-inline:16px}
  .strip{padding-inline:16px}
  .side2{grid-template-columns:1fr}
  .right{padding-inline:16px}
  .doc{padding-inline:16px}
}
/* ===== AI renders tab ===== */
.aigrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 16px}
.aigrid figure{margin:0;display:grid;gap:7px;min-width:0}
.aigrid figure:first-child{grid-column:1/-1}

<script>
(function(){
const D = JSON.parse(document.getElementById("data").textContent);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const T = o => o == null ? "" : typeof o === "string" ? esc(o) : `<span class="en">${esc(o.en)}</span><span class="zh" lang="zh-Hant">${esc(o.zh)}</span>`;
let LANG = "en";
const P = o => o == null ? "" : typeof o === "string" ? o : (LANG === "zh" ? o.zh : o.en);

/* ---------- language (same rule as the home site: ?lang, then aw-lang, then English) ---------- */
function setLang(l, save){
  LANG = l === "zh" ? "zh" : "en";
  document.documentElement.lang = LANG === "zh" ? "zh-Hant" : "en";
  $("langBtn").textContent = LANG === "zh" ? "EN" : "中文";
  if(save){ try{ localStorage.setItem("aw-lang", LANG); }catch(e){} }
  document.title = P(D.title) + " · Anzon Wong";
  refreshAlts();
}
let q = null; try{ q = new URLSearchParams(location.search).get("lang"); }catch(e){}
let stored = null; try{ stored = localStorage.getItem("aw-lang"); }catch(e){}
$("langBtn").onclick = () => setLang(LANG === "zh" ? "en" : "zh", true);

/* ---------- frame: crumb, sidebar, tag ---------- */
$("sbPage").innerHTML = T(D.title);
$("crumb").innerHTML = `<span>PROJECT ${esc(D.num)}</span><span>›</span><span>${T(D.title)}</span><span class="pill">${T(D.type)} · ${esc(D.years)}</span>`;
$("tabTag").textContent = D.tag || "";
const check = '<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m2 5.2 2 2L8 3"/></svg>';
$("side").innerHTML = `
  <div><div class="cap">${T(D.eyebrow)}</div><h1>${T(D.h1)}</h1><p class="loc">${T(D.loc)}</p></div>
  <div class="specs">${D.facts.map(f => `<div><span>${T(f.k)}</span><b>${esc(f.v)}${f.u ? `<small>${T(f.u)}</small>` : ""}</b></div>`).join("")}</div>
  <div><div class="cap" style="margin-bottom:6px"><span class="en">Role</span><span class="zh">角色</span></div><p class="role" style="margin:0">${T(D.role)}${D.role_confirm ? '<span class="tbc"><span class="en">to confirm</span><span class="zh">待確認</span></span>' : ""}</p></div>
  <div><div class="cap" style="margin-bottom:8px"><span class="en">Design rounds</span><span class="zh">設計回合</span></div><ul class="rounds" id="rounds">${D.rounds.map((r,i) => `<li><button type="button" data-r="${esc(r.id)}" aria-current="false"><span class="tick">${check}</span><span><span class="t">${T(r.t)}</span><br><span class="who">${esc(r.date)} · ${T(r.who)}</span></span><span class="who">${String(i+1).padStart(2,"0")}</span></button></li>`).join("")}</ul></div>
  <p class="foot">${T(D.foot).split(" | ").join("<br>")}</p>`;

/* ---------- tabs ---------- */
function showPane(id){
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.pane === id));
  document.querySelectorAll(".pane").forEach(p => p.classList.toggle("on", p.id === id));
  window.dispatchEvent(new Event("resize"));
}
window.showPane = showPane;
/* optional: rename tabs (D.tabs = {tgal:{en,zh}, ...}), hide tabs (D.hide = ["tov"]), start pane (D.start) */
Object.entries(D.tabs || {}).forEach(([k, v]) => { const el = $(k + "L"); if(el) el.innerHTML = T(v); });
(D.hide || []).forEach(k => { if($(k)) $(k).hidden = true; });
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => showPane(t.dataset.pane)));
if(!D.pairs || !D.pairs.length){ if(!D.rounds.some(r => r.p && (r.p.en || r.p.zh))) $("tproc").hidden = true; }

/* ---------- AI renders tab ---------- */
if(D.ai && D.ai.items && D.ai.items.length){
  $("aiLead").innerHTML = T(D.ai.lead);
  $("aiGrid").innerHTML = D.ai.items.map((a,i) => `<figure><button type="button" data-ai="${i}" aria-label="${esc(a.title.en)}"><img loading="lazy" src="${esc(i ? (a.thumb || a.src) : a.src)}" alt="" width="1536" height="1024"><span class="aib">AI</span></button><figcaption>${T(a.title)}<span class="n">${T(a.note)}</span><span class="l">${T(D.ai.label)}</span></figcaption></figure>`).join("");
  $("aiGrid").addEventListener("click", e => { const b = e.target.closest("button[data-ai]"); if(!b) return; const a = D.ai.items[+b.dataset.ai]; openLb(a.src, P(a.title) + " · " + P(D.ai.label)); });
} else { $("tai").hidden = true; }

/* ---------- lightbox + brief ---------- */
const lb = $("lb");
function openLb(src, cap){ $("lbImg").src = src; $("lbImg").alt = cap; $("lbCap").textContent = cap; lb.showModal(); }
$("lbClose").onclick = () => lb.close(); lb.addEventListener("click", e => { if(e.target === lb) lb.close(); });
$("briefIn").innerHTML = `<h3>${T(D.brief.h)}</h3><ul>${D.brief.items.map(x => `<li>${T(x)}</li>`).join("")}</ul><p style="margin:0;color:var(--muted);font-size:12px">${T(D.brief.src)}</p><button class="btn dark" style="justify-self:end" id="briefClose" type="button"><span class="en">Close</span><span class="zh">關閉</span></button>`;
$("briefBtn").onclick = () => $("brief").showModal(); $("briefClose").onclick = () => $("brief").close();

/* ---------- gallery ---------- */
const G = Object.fromEntries(D.groups.map(g => [g.id, g]));
let filter = "all", list = D.items.slice(), cur = 0;
$("stripTitle").innerHTML = `${T(D.strip)} <span>${D.items.length}</span>`;
$("rGroupsH").innerHTML = T(D.groups_h);
$("gFilter").innerHTML = `<button type="button" aria-pressed="true" data-f="all"><span class="en">All</span><span class="zh">全部</span></button>` +
  (D.groups.length > 1 && D.groups.length <= 6 ? D.groups.map(g => `<button type="button" aria-pressed="false" data-f="${esc(g.id)}">${T(g.short || g.label)}</button>`).join("") : "");
$("gFilter").hidden = !(D.groups.length > 1 && D.groups.length <= 6);
function setFilter(f, keep){
  filter = f; list = D.items.filter(it => f === "all" || it.group === f);
  document.querySelectorAll("#gFilter [data-f]").forEach(b => b.setAttribute("aria-pressed", b.dataset.f === f));
  renderThumbs(); go(keep ? Math.max(0, list.indexOf(keep)) : 0, true);
}
function renderThumbs(){
  $("gThumbs").innerHTML = list.map((it,i) => `<button type="button" data-i="${i}" aria-current="false"><img loading="lazy" src="${esc(it.thumb || it.src)}" alt="" width="96" height="64"><span>${esc(it.date || "")}</span></button>`).join("");
}
function go(i, instant){
  if(!list.length) return;
  cur = (i + list.length) % list.length; const it = list[cur], g = G[it.group] || {};
  const img = $("gImg");
  const swap = () => { img.src = it.src; img.width = it.w; img.height = it.h; img.alt = P(it.title); img.classList.remove("fading"); };
  if(instant || !img.getAttribute("src")) swap(); else { img.classList.add("fading"); setTimeout(swap, 140); }
  $("gTitle").innerHTML = T(it.title);
  $("gSub").innerHTML = `${g.label && g.label.en === it.title.en ? T(it.kind) : T(g.label)}${it.date ? " · " + esc(it.date) : ""}`;
  $("gCap").innerHTML = T(it.caption); $("gKind").innerHTML = T(it.kind);
  $("gCount").textContent = `${String(cur+1).padStart(2,"0")} / ${String(list.length).padStart(2,"0")}`;
  $("rNum").innerHTML = `${String(D.items.indexOf(it)+1).padStart(2,"0")}<small>/ ${D.items.length}</small>`;
  $("rKind").innerHTML = T(it.kind);
  $("rMeta").innerHTML = [[{en:"Part",zh:"部分"}, T(g.label)], [{en:"Date",zh:"日期"}, esc(it.date || "")], [{en:"Image",zh:"圖像"}, `${it.w} × ${it.h}`]]
    .concat((it.meta || []).map(m => [m.k, T(m.v)])).map(r => `<li><span>${T(r[0])}</span><span>${r[1]}</span></li>`).join("");
  document.querySelectorAll("#gThumbs button").forEach((b,j) => b.setAttribute("aria-current", j === cur));
  const tb = $("gThumbs").children[cur]; if(tb && tb.scrollIntoView) { const s = $("gThumbs"); s.scrollTo({left: tb.offsetLeft - s.clientWidth/2 + 48, behavior: instant ? "auto" : "smooth"}); }
  document.querySelectorAll("#rGroups button").forEach(b => b.setAttribute("aria-current", b.dataset.g === it.group));
  let rd = D.rounds.findIndex(r => r.item === it.src); if(rd < 0) rd = D.rounds.findIndex(r => !r.item && r.group === it.group);
  document.querySelectorAll("#rounds button").forEach((b,j) => { b.setAttribute("aria-current", j === rd); b.classList.toggle("done", rd >= 0 && j < rd); });
}
function refreshAlts(){ if(list[cur]) $("gImg").alt = P(list[cur].title); }
$("gPrev").onclick = () => go(cur - 1); $("gNext").onclick = () => go(cur + 1);
$("gThumbs").addEventListener("click", e => { const b = e.target.closest("button[data-i]"); if(b) go(+b.dataset.i); });
$("gFilter").addEventListener("click", e => { const b = e.target.closest("button[data-f]"); if(b) setFilter(b.dataset.f); });
const zoom = () => { const it = list[cur]; openLb(it.src, P(it.title) + (it.date ? " · " + it.date : "")); };
$("gZoom").onclick = zoom; $("gImg").addEventListener("click", () => { if(!swiped) zoom(); });
addEventListener("keydown", e => {
  if(lb.open || $("brief").open || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if(!$("pgal").classList.contains("on")) return;
  if(e.key === "ArrowRight"){ go(cur + 1); e.preventDefault(); } else if(e.key === "ArrowLeft"){ go(cur - 1); e.preventDefault(); }
});
let sx = null, swiped = false;
$("gstage").addEventListener("pointerdown", e => { sx = e.clientX; swiped = false; });
$("gstage").addEventListener("pointerup", e => { if(sx === null) return; const dx = e.clientX - sx; sx = null; if(Math.abs(dx) > 40){ swiped = true; go(cur + (dx < 0 ? 1 : -1)); setTimeout(() => swiped = false, 50); } });

/* groups list (right) */
$("rGroups").innerHTML = D.groups.map(g => `<li><button type="button" data-g="${esc(g.id)}" aria-current="false"><span class="d">${esc(g.date || "")}</span><span>${T(g.label)}</span><span class="n">${D.items.filter(i => i.group === g.id).length}</span></button></li>`).join("");
$("rGroups").addEventListener("click", e => { const b = e.target.closest("button[data-g]"); if(!b) return; const first = D.items.find(i => i.group === b.dataset.g); showPane("pgal"); setFilter("all", first); });
$("rounds").addEventListener("click", e => { const b = e.target.closest("button[data-r]"); if(!b) return; const r = D.rounds.find(x => x.id === b.dataset.r);
  const first = (r.item && D.items.find(i => i.src === r.item)) || D.items.find(i => i.group === r.group); if(r.pane){ showPane(r.pane === "process" ? "pproc" : r.pane); } else if(first){ showPane("pgal"); setFilter("all", first); } });

/* notes (right) */
$("rNotes").innerHTML = (D.notes || []).map(n => `<div class="note ${esc(n.cls)}"><b>${T(n.h)}</b>${n.items.length > 1 ? `<ul>${n.items.map(x => `<li>${T(x)}</li>`).join("")}</ul>` : T(n.items[0])}</div>`).join("");

/* ---------- overview ---------- */
$("ovH").innerHTML = T(D.overview.h); $("ovP").innerHTML = T(D.overview.p);
$("ovGrid").innerHTML = D.items.map((it,i) => `<figure><button type="button" data-k="${i}" aria-label="${esc(it.title.en)}"><img loading="lazy" src="${esc(it.thumb || it.src)}" alt="" width="480" height="360"></button><figcaption>${T(it.title)}<span>${T((G[it.group]||{}).label)}${it.date ? " · " + esc(it.date) : ""}</span></figcaption></figure>`).join("");
$("ovGrid").addEventListener("click", e => { const b = e.target.closest("button[data-k]"); if(!b) return; showPane("pgal"); setFilter("all", D.items[+b.dataset.k]); });

/* ---------- process: timeline + pairs ---------- */
$("prH").innerHTML = T(D.process.h); $("prP").innerHTML = T(D.process.p);
$("tl").innerHTML = D.rounds.map(r => `<li data-r="${esc(r.id)}" aria-current="false"><time>${esc(r.date)}</time><span class="d"></span><div class="b"><span class="who">${T(r.who)}</span><h4>${T(r.t)}</h4>${r.p && (r.p.en || r.p.zh) ? `<p>${T(r.p)}</p>` : ""}</div></li>`).join("");
$("tl").addEventListener("click", e => { const l = e.target.closest("li[data-r]"); if(!l) return; const r = D.rounds.find(x => x.id === l.dataset.r); const first = (r.item && D.items.find(i => i.src === r.item)) || D.items.find(i => i.group === r.group); if(first){ showPane("pgal"); setFilter("all", first); } });
function bindCmp(box){ const r = box.querySelector("input"); const f = () => box.style.setProperty("--x", r.value + "%"); r.addEventListener("input", f); f(); }
$("pairs").innerHTML = (D.pairs || []).map(p => {
  const head = `<figcaption><b style="font-weight:500">${T(p.title)}</b><span>${esc(p.meta || "")}</span></figcaption>`;
  const body = p.mode === "slider"
    ? `<div class="cmp" style="--x:50%"><img src="${esc(p.b)}" alt="" loading="lazy"><div class="over"><img src="${esc(p.a)}" alt="" loading="lazy"></div><span class="bar"></span><span class="knob">⇄</span><span class="lab l">${T(p.labA)}</span><span class="lab r">${T(p.labB)}</span><input type="range" min="0" max="100" value="50" aria-label="${esc(p.title.en)}: compare"></div>`
    : `<div class="side2"><div><img src="${esc(p.a)}" alt="" loading="lazy" data-cap="${esc(p.labA.en)}"><span class="lab l">${T(p.labA)}</span></div><div><img src="${esc(p.b)}" alt="" loading="lazy" data-cap="${esc(p.labB.en)}"><span class="lab l">${T(p.labB)}</span></div></div>`;
  return `<figure class="pair">${head}${body}${p.note && (p.note.en || p.note.zh) ? `<p>${T(p.note)}</p>` : ""}</figure>`;
}).join("");
